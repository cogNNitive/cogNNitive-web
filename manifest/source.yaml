# Retired blueprints kept byte-identical on disk for legacy resolution. They are
# NOT part of ACTIVE distribution: the catalog drops them from `blueprints` and
# records them under a top-level `frozen` object; this partition keeps the
# verify.js blueprint inventory guard satisfied while the folders stay on disk.
frozen_blueprints:
  - name: cogNNitive
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/bluepriNNts/cogNNitive/spec_NN.md
    version: "V_0-2-1"
    ref_key: blueprints
  - name: base
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/bluepriNNts/base/spec_NN.md
    version: "V_0-1-0"
    ref_key: blueprints
  - name: workspace
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/bluepriNNts/workspace_spec_NN.md
    version: "V_0-2-2"
    ref_key: blueprints

# Shared seam folders that live under iNNfo/specs/bluepriNNts/ but are NOT
# distributable blueprints: they hold cross-blueprint runtime assets (console
# shells, UMD runtimes, schemas) with no spec_NN.md. Listed here only so the
# verify.js Blueprint Inventory Guard recognizes the folder; the catalog and
# manifest generators skip them (no spec_NN.md to enumerate), same as `assets`.
seam_dirs:
  - name: console
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/bluepriNNts/console/
    description: Shared console seam — artifact shell, InnfoConsole UMD runtime, and feedback JSON schema for the reviewer feedback loop.

# Published console bundle: the single-file runtime + renderers (visuals,
# innfo-runtime, model-viewer, procedure-stepper) that generated console
# artifacts vendor locally for offline `file://` use. Distributed as the
# `console-assets` block of the bootstrap manifest and installed to
# ~/.agents/console by skills-manager. Pinned by tag + commit.
console_assets:
  - name: innfo-console
    repo: cogNNitive/cogNNitive
    file: iNNfo/specs/bluepriNNts/console/innfo-console.bundle.js
    version: "0.6.0"
    ref_key: innfo-console
  - name: innfo-console-shell
    repo: cogNNitive/cogNNitive
    file: iNNfo/specs/bluepriNNts/console/artifact_shell.html
    version: "0.6.0"
    ref_key: innfo-console
  - name: innfo-console-export-cli
    repo: cogNNitive/cogNNitive
    file: scripts/export-console.mjs
    version: "0.6.0"
    ref_key: innfo-console

workflows:
  - id: model
    label: Create an iNNfo model
    description: Turn an idea, document, or dataset into a validated structured model.
    skill: nn-innfo
    blueprint: domaiNN
  - id: transform
    label: Transform a document
    description: Normalize a PDF/DOCX/XLSX into clean Markdown, or export to HTML.
    skill: nn-trannsform

# `refs` is a list of { key, repo, ref }: the tag/branch that channel resolves
# to a commit for a given ref_key. ref_key defaults to an entry's own `repo`;
# entries that share a repo with a different release cadence (e.g. innfo-mcp
# vs. blueprints) declare an explicit `ref_key` and
# get their own row here, with `repo` restated so the generator can catch a
# mismatched key. (A list, not a map, because the focused YAML parser used by
# these zero-dependency scripts does not support `/` inside a mapping key.)
channels:
  stable:
    # The tag is derived as "<key>-v<version>" — never typed. skills and blueprints
    # carry their own channel version (a batch number that exists nowhere else in
    # the repo); innfo-mcp and innfo-console derive theirs from the artifact
    # version declared above, because there it is the same fact, not a copy.
    refs:
      - key: skills
        repo: cogNNitive/cogNNitive
        version: "2.6.0"
      - key: blueprints
        repo: cogNNitive/cogNNitive
        version: "0.18.0"
      - key: innfo-mcp
        repo: cogNNitive/cogNNitive
      - key: innfo-console
        repo: cogNNitive/cogNNitive
  preview:
    refs:
      - key: skills
        repo: cogNNitive/cogNNitive
        ref: main
      - key: blueprints
        repo: cogNNitive/cogNNitive
        ref: main
      - key: innfo-mcp
        repo: cogNNitive/cogNNitive
        ref: main
      - key: innfo-console
        repo: cogNNitive/cogNNitive
        ref: main
