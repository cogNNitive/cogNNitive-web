name: CI & Verify

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Workspace-level deterministic checks (template inventory, script
  #    typecheck, manifest validity, docs build gate).
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives this job full history + all tags, required by
      # `scripts/freshness.js` (`git rev-list --count <tag>..HEAD -- <path>`).
      # The default shallow (depth 1, no tags) checkout would fail that lookup
      # with "unknown revision". Scoped to this job only — quality,
      # spec-integrity, and deploy-pages stay shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The nn-trannsform skill ships its own dependency tree (minimist, prompts,
      # document converters) outside the root workspaces, so `npm ci` above does
      # not install it. `verify.js` step 5b spawns that skill's CLI, which exits 1
      # on a fresh checkout without these deps.
      - name: Install nn-trannsform skill dependencies
        run: npm ci --prefix skills/nn-trannsform

      # Build first: `verify.js` step 0 (MCP Version Square) reads the staged CDN
      # bundle `docs/innfo/cdn/innfo-mcp-v<version>.bundle.js`, which is a
      # gitignored build artifact created here — a fresh checkout has none.
      - name: Build Docs & Bundles Gate
        run: npm run build:docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Deterministic Verification
        run: "node scripts/verify.js ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--release' || '' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Detection, not pre-merge prevention: this step evaluates state already
      # merged to `main` against the pinned template tag. It does not evaluate
      # an unmerged PR's prospective effect on `main`, so a red run here is the
      # first automated signal of drift after a merge, not a gate that could
      # have stopped it before.
      - name: Stable-manifest coherence check (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        run: node scripts/manifest/validate-manifest.js --channel stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Per-subsystem channel drift (how far main has moved past each
      # subsystem's pinned stable tag), local git only. Never blocking:
      # a measurement failure must not redden main or block the Pages
      # deploy — that would be worse than the silence it replaces.
      - name: Compute channel freshness
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/freshness.js

      # Hand the built docs to deploy-pages so Pages publishes exactly what this
      # job verified instead of rebuilding. Only produced on main (the only ref
      # deploy-pages runs on).
      - name: Upload built docs (Pages artifact)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs
          path: docs
          retention-days: 1

  # ── iNNfo quality gate: lint, typecheck, unit tests, app build. Previously
  #    lived in iNNfo/.github/workflows/ci.yml, which GitHub Actions never ran
  #    (only the repo-root .github/workflows/ is executed).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm --workspace=@cognnitive/innfo-core run build

      - name: Lint
        run: npm run lint

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' '*.mts' '*.vue' '*.js' '*.mjs' '*.json' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then
            npx prettier --check --ignore-unknown $CHANGED
          else
            echo "No formattable files changed."
          fi

      - name: Typecheck (app)
        run: npm --workspace=@cognnitive/innfo-editor run typecheck

      - name: Typecheck (innfo-mcp)
        run: npm --workspace=@cognnitive/innfo-mcp run typecheck

      - name: Typecheck (video-parser)
        run: npm --workspace=@cognnitive/innfo-video-parser run typecheck

      - name: Unit tests (core)
        run: npm --workspace=@cognnitive/innfo-core test

      - name: Unit tests (video-parser)
        run: npm --workspace=@cognnitive/innfo-video-parser test

      - name: Unit tests + coverage (innfo-mcp)
        run: npm --workspace=@cognnitive/innfo-mcp run test:coverage

      - name: Unit tests (app)
        run: npm --workspace=@cognnitive/innfo-editor test

      - name: Build app
        run: npm --workspace=@cognnitive/innfo-editor run build

  # ── Every hardcoded raw.githubusercontent.com spec URL must resolve to a
  #    file that exists; specs/ is immutable and filename-encoded.
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check spec URLs resolve
        run: npm run check:spec-urls

      - name: Spec version inventory (informational)
        run: npm run check:spec-version -- --inventory

  deploy-pages:
    needs: [verify, quality, spec-integrity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize only the Pages deployment — not the test jobs above, which
    # must run to completion on every push.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish exactly what `verify` built and validated — no npm ci, no rebuild.
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: pages-docs
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
