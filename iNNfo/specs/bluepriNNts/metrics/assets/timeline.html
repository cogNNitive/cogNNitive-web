<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline — Metrics Template</title>
    <!--
    timeline.html — thinned Timeline Layout shell (metrics template asset:
    timeline-layout). The ~700-line inline dashboard engine was DELETED:
    generating agents must only (1) declare capabilities in the innfo-config
    needs[] list below (pins resolve via console/needs-registry.json — never
    hand-edit URLs), (2) paste the resolved template schema into #innfo-schema,
    and (3) paste the innfo-model snapshot into #innfo-model. Nothing else in
    this file is edited. The shared runtime (innfo-console.bundle.js,
    window.InnfoConsole) renders banner, rail, search, element cards, matrices,
    charts (uPlot from the vendored bundle) and the feedback-export modal. No
    inline runtime code belongs here — the no-inline-runtime scan
    (verify.harness.js --check-slots) rejects it.

    innfo-model snapshot contract (see assets/MODEL_DATA.template.json):
      meta: model, model_version, source_model, generated_at, months,
            historyMonths, charts, slug, title, startMonth, startYear
      rows: [{ id, grp, label, metricType, source, variable?, formula?,
               history?, colors?, growth {mode: fixed|compound|additive} }]
      series: { "<chartId>": number[] } — PRE-COMPUTED month values, pure JSON
               data only (no executable JS); horizon capped at 120 months.
    The snapshot step pre-computes SERIES into pure-JSON (series-as-data);
    the runtime only renders. RESOLUTION RECORD: series-as-data was ADOPTED;
    the executable-logic slot (FORMULAS/DEPS/SERIES as JS in the slot) was
    REJECTED because it breaks the two-slot contract, needs eval, and harms
    file:// safety. The pilot declares the "charts" capability (registered in
    console/needs-registry.json; renderer = innfo-runtime renderCharts with
    vendored uPlot inside innfo-console.bundle.js) plus the minimal set below,
    adding "feedback-export" only when the export UI is required.

    Generation gate: no console is generated while the activation gate is
    closed (runtime pins unreachable, file:// smoke failing, or "charts" not
    registered — see procedures/create_timeline_procedures_NN.md step Check Activation
    Gate).

    Runtime loading (static script tags only — file:// compatible, no modules,
    no network fetch calls):
      - Primary: jsDelivr pin @innfo-console-v0.1.0.
      - Fallback: raw.githubusercontent mirror, then the vendored copy
        shipped next to the generated console for offline double-click.
      The runtime no-ops on re-execution, so the fallback tags below are
      safe: exactly one copy boots.
    -->
    <style>
      /* Semantic tokens come from InnfoUI (data-theme driven). Local aliases keep
         this shell's layout variables working without hard-coded colors. */
      :root {
        --bg: var(--innfo-bg);
        --surface: var(--innfo-surface);
        --surface-2: var(--innfo-surface-2);
        --text: var(--innfo-text);
        --muted: var(--innfo-muted);
        --faint: var(--innfo-muted);
        --border: var(--innfo-border);
        --primary: var(--innfo-accent);
        --primary-hover: var(--innfo-text);
        --success: var(--innfo-status-applied);
        --danger: var(--innfo-status-rejected);
        --warning: var(--innfo-status-pending);
        --link: var(--innfo-link);
        --radius-sm: var(--innfo-radius-sm);
        --radius: var(--innfo-radius);
        --radius-lg: var(--innfo-radius-lg);
        --shadow-card: var(--innfo-shadow);
        --font: var(--innfo-font);
        --mono: var(--innfo-mono);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      code {
        font-family: var(--mono);
        font-size: 0.85em;
      }
      #innfo-layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 0;
        align-items: start;
      }
      @media (max-width: 820px) {
        #innfo-layout {
          grid-template-columns: 1fr;
        }
      }
      #innfo-rail {
        position: sticky;
        top: 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 100vh;
        overflow-y: auto;
      }
      @media (max-width: 820px) {
        #innfo-rail {
          position: static;
          max-height: none;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
      .innfo-rail-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        background: transparent;
        border: none;
        border-left: 3px solid transparent;
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 0.84rem;
        color: var(--text);
        font: inherit;
      }
      .innfo-rail-item:hover {
        background: var(--surface-2);
      }
      .innfo-rail-item.active {
        background: var(--surface-2);
        border-left-color: var(--primary);
        font-weight: 700;
      }
      main {
        padding: 24px 28px 96px;
        max-width: 1080px;
        min-width: 0;
      }
      .innfo-toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      #innfo-search {
        flex: 1 1 280px;
        max-width: 420px;
        padding: 8px 12px;
        font: inherit;
        font-size: 0.9rem;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      #innfo-search:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--text);
      }
      .innfo-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin-bottom: 12px;
        scroll-margin-top: 12px;
        box-shadow: var(--shadow-card);
      }
      .innfo-card h3 {
        margin: 0 0 4px 0;
        font-size: 1rem;
        font-weight: 700;
      }
      .innfo-card-concept {
        color: var(--muted);
        font-size: 0.78rem;
        margin: 0 0 8px 0;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .innfo-card-fields {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 4px 12px;
        font-size: 0.84rem;
        margin: 10px 0 0;
      }
      .innfo-card-fields dt {
        color: var(--muted);
        font-weight: 600;
      }
      .innfo-card-fields dd {
        margin: 0;
      }
      .innfo-matrix {
        margin: 24px 0;
      }
      .innfo-matrix h3 {
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .innfo-matrix table {
        border-collapse: collapse;
        font-size: 0.82rem;
        width: 100%;
      }
      .innfo-matrix th,
      .innfo-matrix td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }
      .innfo-matrix thead th,
      .innfo-matrix tbody th:first-child {
        background: var(--surface-2);
        font-weight: 600;
      }
      #innfo-ref-dialog {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 0;
        max-width: 480px;
        width: 100%;
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
      }
      #innfo-ref-dialog::backdrop {
        background: rgba(0, 0, 0, 0.35);
      }
      #innfo-ref-dialog .innfo-ref-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      #innfo-ref-dialog .innfo-ref-head h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
      }
      #innfo-ref-dialog .innfo-ref-close {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        border-radius: var(--radius-sm);
        width: 28px;
        height: 28px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
      }
      #innfo-ref-dialog .innfo-ref-body {
        padding: 16px 20px 20px;
      }
      #innfo-ref-dialog .innfo-ref-tag {
        display: inline-block;
        font-size: 0.64rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);

        border-radius: 999px;
        margin-bottom: 10px;

      #innfo-ref-dialog .innfo-ref-desc {
        margin: 0 0 12px;
        font-size: 0.88rem;
      }
      #innfo-ref-dialog .innfo-ref-fields {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 3px 14px;
        margin: 0;
        font-size: 0.8rem;
      }
      #innfo-ref-dialog .innfo-ref-fields dt {

        font-weight: 600;
      }
      #innfo-ref-dialog .innfo-ref-fields dd {

      }
      .innfo-ref-pill {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--link);
        border-radius: 999px;
        padding: 1px 8px;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }
      .innfo-ref-pill:hover {
        border-color: var(--link);
        background: rgba(37, 99, 235, 0.06);
      }
      /* Generic document view (renderDocument) */
      #innfo-doc .doc-root {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 20px 22px;
        margin-bottom: 14px;
        box-shadow: var(--shadow-card);
      }
      #innfo-doc .doc-root h2 {
        margin: 0 0 8px;
        font-size: 1.15rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #innfo-doc .doc-root p.desc,
      #innfo-doc .doc-step p.desc {
        margin: 0 0 10px;
        font-size: 0.9rem;
      }
      #innfo-doc .doc-step {
        border-left: 3px solid var(--border);
        padding: 12px 16px;
        margin: 0 0 10px 8px;
        background: var(--surface);
      }
      #innfo-doc .doc-step h3 {
        margin: 0 0 6px;
        font-size: 0.98rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #innfo-doc .doc-icon {
        color: var(--muted);
      }
      #innfo-doc .doc-fields {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 3px 14px;
        margin: 8px 0 0;
        font-size: 0.8rem;
      }
      #innfo-doc .doc-fields dt {
        color: var(--muted);
        font-weight: 600;
      }
      #innfo-doc .doc-fields dd {
        margin: 0;
      }
      .empty-state {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 40px 0;
      }
      #innfo-charts {
        margin: 24px 0 0;
      }
      #innfo-charts .innfo-chart {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      #innfo-charts .innfo-chart-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0 0 10px;
      }
      #innfo-charts .innfo-chart-canvas {
        min-height: 240px;
      }
      /* View Tabs */
      .innfo-view-tabs {
        display: flex;
        gap: 8px;
        padding: 10px 28px 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .innfo-view-tab {
        appearance: none;
        border: none;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        padding: 8px 16px 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .innfo-view-tab:hover {
        color: var(--text);
      }
      .innfo-view-tab.active {
        color: var(--text);
        border-bottom-color: var(--primary);
      }
      .innfo-tab-panel {
        display: none;
      }
      .innfo-tab-panel.active {
        display: block;
      }
      /* Timeline Grid Styles */
      #innfo-timeline-grid {
        margin: 20px 0 32px 0;
      }
      .innfo-timeline-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .innfo-timeline-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
      }
      .innfo-kpi-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .innfo-kpi-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow-card);
      }
      .innfo-kpi-label {
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .innfo-kpi-val {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 4px 0 2px;
      }
      .innfo-kpi-meta {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .innfo-timeline-table-wrap {
        overflow: auto;
        max-height: calc(100vh - 200px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-card);
        position: relative;
      }
      .innfo-timeline-table {
        border-collapse: collapse;
        font-size: 0.82rem;
        width: 100%;
        white-space: nowrap;
      }
      .innfo-timeline-table th,
      .innfo-timeline-table td {
        border: 1px solid var(--border);
        padding: 6px 10px;
      }
      .innfo-timeline-table th.th-sticky {
        position: sticky;
        left: 0;
        top: 0;
        z-index: 20;
        background: var(--surface-2);
        border-right: 2px solid var(--border);
      }
      .innfo-timeline-table td.td-sticky {
        position: sticky;
        left: 0;
        background: var(--surface);
        z-index: 5;
        border-right: 2px solid var(--border);
      }
      .innfo-timeline-table thead th {
        background: var(--surface-2);
        font-weight: 700;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 2px solid var(--border);
      }
      .innfo-timeline-table th.hist-col,
      .innfo-timeline-table td.hist-cell {
        background: rgba(37, 99, 235, 0.04);
      }
      .innfo-timeline-table td.td-num,
      .innfo-timeline-table th.th-month,
      .innfo-timeline-table th.th-total {
        text-align: right;
        font-family: var(--mono);
      }
      .innfo-timeline-table td.td-total {
        font-weight: 700;
        background: var(--surface-2);
      }
      .innfo-timeline-grp td {
        background: var(--surface-2);
        padding: 6px 10px;
        font-weight: 700;
      }
      .innfo-pinned-grp td {
        background: rgba(37, 99, 235, 0.08);
        border-bottom: 2px solid var(--link);
      }
      .innfo-pinned-grp .innfo-grp-badge {
        color: var(--link);
      }
      .innfo-timeline-row.is-pinned td {
        background: rgba(37, 99, 235, 0.03);
      }
      .innfo-timeline-row.is-pinned td.td-sticky {
        background: rgba(37, 99, 235, 0.06);
      }
      .innfo-timeline-row.is-focus-root td {
        background: rgba(37, 99, 235, 0.08);
      }
      .innfo-timeline-row.is-focus-root td.td-sticky {
        background: rgba(37, 99, 235, 0.14);
        border-left: 3px solid var(--link);
      }
      .innfo-timeline-filter-banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid var(--link);
        border-radius: var(--radius-sm);
        padding: 8px 14px;
        margin-bottom: 12px;
      }
      .innfo-filter-banner-text {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--link);
      }
      .innfo-filter-banner-clear {
        appearance: none;
        border: 1px solid var(--link);
        background: var(--surface);
        color: var(--link);
        border-radius: var(--radius-sm);
        padding: 3px 8px;
        font: inherit;
        font-size: 0.74rem;
        font-weight: 700;
        cursor: pointer;
      }
      .innfo-filter-banner-clear:hover {
        background: var(--link);
        color: #ffffff;
      }
      .innfo-grp-badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .innfo-row-actions {
        display: inline-flex;
        gap: 2px;
        margin-right: 6px;
        vertical-align: middle;
      }
      .innfo-row-btn {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        padding: 1px 3px;
        font-size: 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.4;
        transition: opacity 0.15s ease, background 0.15s ease;
      }
      .innfo-row-btn:hover {
        opacity: 1;
        background: var(--surface-2);
        border-color: var(--border);
      }
      .innfo-row-btn.active, .innfo-row-btn.pinned {
        opacity: 1;
        background: rgba(37, 99, 235, 0.15);
        border-color: var(--link);
      }
      .innfo-row-marker {
        display: inline-block;
        width: 16px;
        text-align: center;
        margin-right: 6px;
        font-weight: 700;
      }
      .innfo-row-marker.marker-var { color: var(--link); }
      .innfo-row-marker.marker-calc { color: var(--success); }
      .innfo-row-marker.marker-der { color: var(--warning); }
      .innfo-row-name { font-weight: 600; }
      .td-rule { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
      .td-unit { color: var(--muted); font-size: 0.78rem; }
      .innfo-timeline-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .innfo-btn-reset, .innfo-btn-csv {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: var(--radius-sm);
        padding: 5px 10px;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }
      .innfo-btn-reset:hover, .innfo-btn-csv:hover {
        background: var(--surface-2);
        color: var(--text);
      }

        font: inherit;
        font-size: 0.75rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 2px 4px;

      }
      .innfo-studio-kpi-card.is-highlight {
        border-color: var(--link);
        background: rgba(37, 99, 235, 0.03);
      }
      .innfo-studio-kpi-label {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .innfo-studio-kpi-val-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .innfo-studio-kpi-val {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--mono);
        color: var(--text);
      }
      .innfo-studio-kpi-unit {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .innfo-studio-grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .innfo-studio-grid {
          grid-template-columns: 1fr;
        }
      }
      .innfo-studio-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: var(--shadow-card);
      }
      .innfo-studio-panel-hdr {
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
      }
      .innfo-studio-panel-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
      }
      .innfo-studio-sliders-wrap {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .innfo-slider-card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
      }
      .innfo-slider-card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .innfo-slider-label {
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--text);
      }
      .innfo-slider-num-input {
        font: inherit;
        font-family: var(--mono);
        font-size: 0.82rem;
        width: 80px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 6px;
        text-align: right;
        color: var(--text);
      }
      .innfo-slider-row {
        margin-bottom: 6px;
      }
      .innfo-slider-range {
        width: 100%;
        accent-color: var(--link);
        cursor: pointer;
      }
      .innfo-slider-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.72rem;
        color: var(--muted);
        font-family: var(--mono);
      }
      .innfo-slider-reset {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--link);
        cursor: pointer;
        font: inherit;
        font-size: 0.72rem;
        text-decoration: underline;
        padding: 0;
      }
      .innfo-studio-chart-box {
        width: 100%;
        overflow-x: auto;
      }
      .innfo-studio-chart-svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .innfo-chart-axis-line {
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 3 3;
      }
      .innfo-chart-axis-text {
        fill: var(--muted);
        font-size: 11px;
        font-family: var(--mono);
      }
      .innfo-chart-legend-text {
        fill: var(--text);
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
