<template>
  <style>
    /* Safe area of the canvas this component is rendered on (spec S6): every format
       project root declares --safe-top/right/bottom/left in pixels for its own canvas,
       so the component lays out inside that rectangle and its percentages are relative
       to it. The fallbacks are the title-safe 10%. The render driver stamps the root's
       data-width/data-height with the canvas of the project it is staged into. */
    #root {
      position: absolute; overflow: visible;
      top: var(--safe-top, 10%); right: var(--safe-right, 10%);
      bottom: var(--safe-bottom, 10%); left: var(--safe-left, 10%);
    }
    .nn-quote {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: 80%; text-align: center;
      background: rgba(0, 0, 0, 0.75); border-radius: 16px; padding: 28px 36px;
      border-top: 6px solid var(--accent, #7c3aed);
      font-family: var(--font, Inter), sans-serif;
      font-size: 44px; font-style: italic; color: #fff;
    }
    [data-composition-id="quote"].nn-pos-center .nn-quote { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    [data-composition-id="quote"].nn-pos-top .nn-quote { left: 50%; top: 10%; bottom: auto; transform: translateX(-50%); }
    [data-composition-id="quote"].nn-pos-bottom .nn-quote { left: 50%; bottom: 10%; top: auto; transform: translateX(-50%); }
    [data-composition-id="quote"].nn-pos-top-left .nn-quote { left: 5%; top: 10%; bottom: auto; right: auto; transform: none; text-align: left; }
    [data-composition-id="quote"].nn-pos-top-right .nn-quote { right: 5%; left: auto; top: 10%; bottom: auto; transform: none; text-align: right; }
    [data-composition-id="quote"].nn-pos-bottom-left .nn-quote { left: 5%; bottom: 10%; top: auto; right: auto; transform: none; text-align: left; }
    [data-composition-id="quote"].nn-pos-bottom-right .nn-quote { right: 5%; left: auto; bottom: 10%; top: auto; transform: none; text-align: right; }
  </style>

      {"id":"position","type":"string","label":"Position","default":"center"},
      {"id":"enter","type":"string","label":"Enter","default":""},
      {"id":"exit","type":"string","label":"Exit","default":""},
      {"id":"font","type":"string","label":"Font","default":"Inter"},
      {"id":"accent","type":"string","label":"Accent","default":"#7c3aed"}
    ]'
