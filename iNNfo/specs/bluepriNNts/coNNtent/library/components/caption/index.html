<template>
  <style>
    /* Safe area of the canvas this component is rendered on (spec S6): every format
       project root declares --safe-top/right/bottom/left in pixels for its own canvas,
       so the component lays out inside that rectangle and its percentages are relative
       to it. The fallbacks are the title-safe 10%. The render driver stamps the root's
       data-width/data-height with the canvas of the project it is staged into. */
    #root {
      position: absolute; overflow: visible;
      top: var(--safe-top, 10%); right: var(--safe-right, 10%);
      bottom: var(--safe-bottom, 10%); left: var(--safe-left, 10%);
    }
    .nn-caption {
      position: absolute; right: 5%; bottom: 10%; max-width: 60%;
      text-align: right; background: rgba(0, 0, 0, 0.55);
      border-radius: 8px; padding: 8px 14px;
      font-family: var(--font, Inter), sans-serif;
      font-size: 26px; color: #fff;
    }
    [data-composition-id="caption"].nn-pos-bottom-right .nn-caption { bottom: 10%; top: auto; right: 5%; left: auto; text-align: right; }
    [data-composition-id="caption"].nn-pos-bottom-left .nn-caption { bottom: 10%; top: auto; left: 5%; right: auto; text-align: left; }
    [data-composition-id="caption"].nn-pos-top-right .nn-caption { top: 10%; bottom: auto; right: 5%; left: auto; text-align: right; }
    [data-composition-id="caption"].nn-pos-top-left .nn-caption { top: 10%; bottom: auto; left: 5%; right: auto; text-align: left; }
    [data-composition-id="caption"].nn-pos-top .nn-caption { top: 10%; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); text-align: center; }
    [data-composition-id="caption"].nn-pos-bottom .nn-caption { bottom: 10%; top: auto; left: 50%; right: auto; transform: translateX(-50%); text-align: center; }
    [data-composition-id="caption"].nn-pos-center .nn-caption { top: 50%; bottom: auto; left: 50%; right: auto; transform: translate(-50%, -50%); text-align: center; }
  </style>
  <div
    id="root"
    data-composition-id="caption"
    data-composition-variables='[
      {"id":"text","type":"string","label":"Text","default":""},
      {"id":"src","type":"string","label":"Source","default":""},
      {"id":"position","type":"string","label":"Position","default":"bottom-right"},
      {"id":"enter","type":"string","label":"Enter","default":""},
      {"id":"exit","type":"string","label":"Exit","default":""},
      {"id":"font","type":"string","label":"Font","default":"Inter"},
      {"id":"accent","type":"string","label":"Accent","default":"#7c3aed"}
    ]'
