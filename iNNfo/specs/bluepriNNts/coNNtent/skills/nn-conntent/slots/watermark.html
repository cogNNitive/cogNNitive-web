<template>
  <style>
    /* Safe area of the canvas this component is rendered on (spec S6): every format
       project root declares --safe-top/right/bottom/left in pixels for its own canvas,
       so the component lays out inside that rectangle and its percentages are relative
       to it. The fallbacks are the title-safe 10%. The render driver stamps the root's
       data-width/data-height with the canvas of the project it is staged into. */
    #root {
      position: absolute; overflow: visible;
      top: var(--safe-top, 10%); right: var(--safe-right, 10%);
      bottom: var(--safe-bottom, 10%); left: var(--safe-left, 10%);
    }
    .nn-watermark {
      position: absolute; left: 0; right: 0; bottom: 3%;
      text-align: center;
      font-family: var(--font, Inter), sans-serif;
      font-size: 20px; color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    [data-composition-id="watermark"].nn-pos-bottom .nn-watermark { top: auto; bottom: 3%; left: 0; right: 0; text-align: center; }
    [data-composition-id="watermark"].nn-pos-top .nn-watermark { bottom: auto; top: 3%; left: 0; right: 0; text-align: center; }
    [data-composition-id="watermark"].nn-pos-top-left .nn-watermark { bottom: auto; top: 3%; left: 3%; right: auto; text-align: left; }
    [data-composition-id="watermark"].nn-pos-top-right .nn-watermark { bottom: auto; top: 3%; right: 3%; left: auto; text-align: right; }
    [data-composition-id="watermark"].nn-pos-bottom-left .nn-watermark { top: auto; bottom: 3%; left: 3%; right: auto; text-align: left; }
    [data-composition-id="watermark"].nn-pos-bottom-right .nn-watermark { top: auto; bottom: 3%; right: 3%; left: auto; text-align: right; }
    [data-composition-id="watermark"].nn-pos-center .nn-watermark { top: 50%; bottom: auto; left: 0; right: 0; transform: translateY(-50%); text-align: center; }
  </style>
  <div
    id="root"
    data-composition-id="watermark"
    data-composition-variables='[
      {"id":"text","type":"string","label":"Text","default":""},
      {"id":"src","type":"string","label":"Source","default":""},
      {"id":"position","type":"string","label":"Position","default":"bottom"},
      {"id":"enter","type":"string","label":"Enter","default":""},
      {"id":"exit","type":"string","label":"Exit","default":""},
      {"id":"font","type":"string","label":"Font","default":"Inter"},
      {"id":"accent","type":"string","label":"Accent","default":"#7c3aed"}
    ]'

</template>
