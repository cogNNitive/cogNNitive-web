<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iNNfo Model Viewer</title>
  <!--
    Reference shell for the "Compile Model Viewer" procedure.

    The generating agent replaces ONLY the contents of the two JSON blocks below:
      #innfo-schema  -> Schema JSON Contract  (concepts, fields, markers, matrices)
      #innfo-model   -> Model JSON Contract   (meta, elements, matrices)
    Nothing else in this file is edited. The renderer is template-agnostic.
  -->
  <style>
    :root {
      --bg: #f9fafb;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #1f2937;
      --link: #2563eb;
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'SF Mono', ui-monospace, 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-2: #263549;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #cbd5e1;
        --link: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: var(--mono); font-size: 0.85em; }

    header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    header .meta-line { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
    header .meta-line span strong { color: var(--text); font-weight: 600; }

    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 0; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    nav.rail {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 20px 12px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    @media (max-width: 820px) { nav.rail { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
    nav.rail button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav.rail button:hover { background: var(--surface-2); }
    nav.rail button.active { background: var(--surface-2); border-left-color: var(--accent); font-weight: 700; }
    nav.rail button .count { color: var(--muted); font-size: 0.75rem; font-weight: 600; }

    main { padding: 24px 32px 96px; min-width: 0; }
    .search-wrap { margin-bottom: 24px; }
    .search-wrap input {
      width: 100%;
      max-width: 420px;
      padding: 9px 12px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    section.concept { margin-bottom: 40px; scroll-margin-top: 16px; }
    section.concept > h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    section.concept > h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
    section.concept > .concept-sub { font-size: 0.8rem; color: var(--muted); margin: 0 0 14px; }

    .element {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
      scroll-margin-top: 16px;
    }
    .element > .el-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .element > .el-head:hover { background: var(--surface-2); }
    .element > .el-head .el-name { font-weight: 700; font-size: 0.92rem; }
    .element > .el-head .chevron { margin-left: auto; color: var(--muted); transition: transform 0.15s; flex: none; }
    .element.open > .el-head .chevron { transform: rotate(90deg); }

    .chip {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip b { color: var(--text); font-weight: 700; }

    .el-body { display: none; padding: 4px 14px 16px; border-top: 1px solid var(--border); }
    .element.open > .el-body { display: block; }
    .el-body p.desc { margin: 12px 0; font-size: 0.88rem; }
    .el-body table.fields { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0; }
    .el-body table.fields td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .el-body table.fields td:first-child { color: var(--muted); width: 160px; font-weight: 600; }
    .el-body .rel-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.82rem; }
    .el-body .rel-list li { padding: 3px 0; }
    .el-body .rel-list .rel-field { color: var(--muted); font-weight: 600; }

    .matrix-block { margin-bottom: 32px; }
    .matrix-block h3 { font-size: 0.95rem; font-weight: 800; margin: 0 0 8px; }
    .matrix-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table.matrix { border-collapse: collapse; font-size: 0.78rem; width: 100%; }
    table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; white-space: nowrap; }
    table.matrix thead th { background: var(--surface-2); font-weight: 700; }
    table.matrix tbody th { background: var(--surface-2); text-align: left; font-weight: 700; }
    table.matrix td:empty::after { content: "·"; color: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 40px 0; }
    h2.group-title { font-size: 1rem; font-weight: 800; margin: 48px 0 16px; padding-top: 20px; border-top: 1px dashed var(--border); }
  </style>
</head>
<body>
  <header>
    <span class="badge">iNNfo Model Viewer</span>
    <h1 id="doc-title">Model Viewer</h1>
    <div class="meta-line" id="doc-meta"></div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Filter elements by name or field value…" autocomplete="off" />
      </div>
      <div id="content"></div>
    </main>
  </div>

    <!-- innfo-console seam: capability gate (pins in console/needs-registry.json). Slots below stay the only per-model payload. -->
    <script type="application/json" id="innfo-config">
      {
        "needs": [
          "concept-rail",
          "fulltext-search",
          "matrix-grids",
          "hash-routing",
          "feedback-export"
        ],
        "runtime": {
          "cdn": "https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.1.0/iNNfo/specs/templates/console/innfo-runtime.js",
          "fallback": "https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-runtime.js"
        }
      }
    </script>
  <script type="application/json" id="innfo-schema">
{}
  </script>
  <script type="application/json" id="innfo-model">
{}
  </script>
    <!-- Shared console runtime (static tags: CDN primary, mirror fallback — no fetch, no modules). -->
    <script src="https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.1.0/iNNfo/specs/templates/console/innfo-runtime.js"></script>
    <script src="https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-runtime.js"></script>

    <!-- Domain renderer: model-viewer consultation UI (static tags: CDN primary, mirror, vendored — no fetch, no modules). -->
    <script src="https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.1.0/iNNfo/specs/templates/console/render-model-viewer.js"></script>
    <script src="https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/render-model-viewer.js"></script>
    <script src="./render-model-viewer.js"></script>
</body>
</html>
