<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NN Procedures Console</title>
  <!--
    Reference shell for the "Compile Procedures Console" procedure.

    The generating agent replaces ONLY the contents of the two JSON blocks below:
      #innfo-schema  -> Schema JSON Contract  (concepts, fields, markers, matrices)
      #innfo-model   -> Model JSON Contract   (meta, elements, matrices)
    Nothing else in this file is edited. The renderer is template-agnostic
    and lives in console/render-procedure-stepper.js (UMD window.InnfoProcedureStepper).
  -->
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --accent: #6366f1;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --radius-sm: 6px;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --surface: #0f172a;
        --surface-2: #1e293b;
        --surface-3: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --faint: #64748b;
        --border: #1e293b;
        --border-strong: #334155;
        --primary: #38bdf8;
        --primary-hover: #7dd3fc;
        --primary-light: rgba(56, 189, 248, 0.15);
        --accent: #818cf8;
        --success: #22c55e;
        --success-light: rgba(34, 197, 94, 0.15);
        --warning: #fbbf24;
        --warning-light: rgba(251, 191, 36, 0.15);
        --danger: #f87171;
        --danger-light: rgba(248, 113, 113, 0.15);
        --info: #38bdf8;
        --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    code { font-family: var(--mono); font-size: 0.85em; }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.4px; }
    header .meta-line { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
    header .meta-line span strong { color: var(--text); font-weight: 600; }

    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    nav.rail {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 20px 10px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    @media (max-width: 820px) { nav.rail { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
    nav.rail .rail-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 0 10px 8px;
    }
    nav.rail button.rail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s ease;
    }
    nav.rail button.rail-item:hover { background: var(--surface-2); }
    nav.rail button.rail-item.active { background: var(--surface-2); border-left-color: var(--primary); font-weight: 700; }
    nav.rail button.rail-item .count { color: var(--muted); font-size: 0.74rem; font-weight: 600; }
    nav.rail button.rail-item .rail-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
      margin-right: 6px;
    }
    nav.rail button.rail-item .rail-label-text { flex: 1 1 auto; min-width: 0; }
    nav.rail button.rail-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    main { max-width: 1320px; padding: 20px 24px 96px; min-width: 0; }

    /* Primary tabs: Procedures | Matrices */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    button.tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.12s ease, border-color 0.12s ease;
    }
    button.tab:hover { color: var(--text); }
    button.tab.active { color: var(--text); border-bottom-color: var(--primary); }
    button.tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); border-radius: 4px; }

    section[data-view] { display: none; }
    section[data-view].active { display: block; }

    /* Sub-tabs inside Procedures: Document | Interactive Runner & DAG */
    .subtabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }
    button.subtab {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button.subtab:hover { border-color: var(--muted); color: var(--text); }
    button.subtab.active { background: var(--primary); border-color: var(--primary); color: #ffffff; }
    button.subtab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }
    #wizard-body.hidden { display: none; }
    #doc-body.hidden { display: none; }

    /* Document view */
    .doc-root {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }
    .doc-root h2 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .doc-root p.desc { margin: 0; font-size: 0.9rem; color: var(--muted); }
    .doc-step {
      border-left: 3px solid var(--border);
      padding: 12px 16px;
      margin: 0 0 10px 8px;
      background: var(--surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .doc-step h3 { margin: 0 0 6px; font-size: 0.98rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .doc-step .step-type-icon { color: var(--muted); }
    .doc-step p.desc { margin: 0 0 10px; font-size: 0.88rem; color: var(--muted); }

    /* Procedure switcher tabs */
    #proc-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    button.proc-tab {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button.proc-tab:hover { border-color: var(--muted); color: var(--text); }
    button.proc-tab.active { background: var(--surface-2); border-color: var(--primary); color: var(--primary); font-weight: 700; }
    button.proc-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    /* Progress & Status Bar */
    .proc-status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-card);
    }
    .proc-status-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .proc-status-title {
      font-size: 0.82rem;
      color: var(--text);
    }
    .proc-progress-track {
      flex: 1;
      max-width: 240px;
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .proc-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.3s ease;
    }
    .proc-status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
    }
    .proc-timer {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    /* Execution 3-Pane Workspace */
    .exec-workspace {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .exec-workspace { grid-template-columns: 280px 1fr; }
      .exec-log-col { grid-column: span 2; }
    }
    @media (max-width: 768px) {
      .exec-workspace { grid-template-columns: 1fr; }
      .exec-log-col { grid-column: span 1; }
    }

    .exec-dag-col, .exec-log-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .exec-col-header {
      padding: 10px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .exec-col-header span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .count-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-faint);
    }
    .btn-xs {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-xs:hover { background: var(--surface-3); }

    /* SVG DAG Canvas */
    .exec-dag-view {
      padding: 12px;
      max-height: 580px;
      overflow-y: auto;
      background: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    svg.dag-canvas {
      width: 100%;
      display: block;
    }
    .dag-node {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dag-node:hover {
      transform: translateY(-1px);
    }
    .dag-node rect {
      fill: var(--surface);
      stroke: var(--border-strong);
      stroke-width: 1.5;
      transition: all 0.2s ease;
    }
    .dag-node.active rect {
      stroke: var(--primary);
      stroke-width: 2;
      fill: var(--primary-light);
    }
    .dag-node.done rect {
      stroke: var(--success);
      stroke-width: 1.5;
      fill: var(--success-light);
    }
    .dag-node .node-dot {
      fill: var(--faint);
    }
    .dag-node.active .node-dot { fill: var(--primary); }
    .dag-node.done .node-dot { fill: var(--success); }
    .dag-node.decision rect { stroke: var(--warning); }
    .dag-node.decision.active rect { stroke: var(--warning); fill: var(--warning-light); }
    .dag-node text.node-sub {
      font-size: 9px;
      font-weight: 700;
      fill: var(--muted);
      font-family: var(--font);
    }
    .dag-node text.node-title {
      font-size: 11px;
      font-weight: 600;
      fill: var(--text);
      font-family: var(--font);
    }
    .dag-edge {
      stroke: var(--border-strong);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }
    .dag-edge.active {
      stroke: var(--primary);
      stroke-width: 2;
      stroke-dasharray: 4;
      animation: dagDash 1s linear infinite;
    }
    .dag-edge.done { stroke: var(--success); }
    @keyframes dagDash { to { stroke-dashoffset: -8; } }

    /* Active Step Card */
    .exec-step-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 20px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .exec-step-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .step-type-pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pill-task { background: var(--primary-light); color: var(--primary); }
    .pill-decision { background: var(--warning-light); color: var(--warning); }
    .pill-event { background: var(--accent); color: #ffffff; }

    .step-state-badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--muted);
    }
    .step-state-badge.state-active { background: var(--primary-light); color: var(--primary); }
    .step-state-badge.state-done { background: var(--success-light); color: var(--success); }

    .exec-step-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0;
    }
    .exec-step-desc {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    /* Contextual RACI Panel */
    .exec-raci-box, .exec-tool-box, .exec-decision-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .exec-box-title {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .exec-raci-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button.raci-item-btn {
      appearance: none;
      font: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 0.76rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s ease;
    }
    button.raci-item-btn:hover { border-color: var(--primary); }
    .raci-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .raci-r { background: #fee2e2; color: #b91c1c; }
    .raci-a { background: #fef3c7; color: #b45309; }
    .raci-c { background: #e0f2fe; color: #0369a1; }
    .raci-i { background: #f1f5f9; color: #475569; }

    /* Artifact I/O Grid */
    .exec-io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) { .exec-io-grid { grid-template-columns: 1fr; } }
    .io-panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .io-panel-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .io-panel-name {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
    }
    .io-check-label {
      font-size: 0.76rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* CLI Tool Helper */
    .exec-cli-snippet {
      background: #090d16;
      color: #38bdf8;
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: all;
    }
    .exec-cli-snippet code {
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-copy {
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.25); }

    /* Decision Gate */
    .decision-btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-branch {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .btn-branch:hover { border-color: var(--warning); background: var(--surface-3); }

    /* Stepper Actions */
    .exec-actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn-group-right { display: flex; gap: 8px; }

    button.btn {
      appearance: none;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.12s ease;
    }
    button.btn:hover:not(:disabled) { background: var(--surface-2); }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
    button.btn-primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
    button.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    /* Live Execution Log */
    .exec-log-view {
      padding: 12px;
      max-height: 580px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .audit-item {
      font-size: 0.78rem;
      border-left: 2px solid var(--border-strong);
      padding-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .audit-item.status-done { border-left-color: var(--success); }
    .audit-item.status-active { border-left-color: var(--primary); }
    .audit-item.status-skipped { border-left-color: var(--muted); }
    .audit-item.status-warning { border-left-color: var(--warning); }
    .audit-time {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--faint);
    }
    .audit-author { font-weight: 600; color: var(--text); }
    .audit-text { color: var(--text); }

    /* Export Modal */
    dialog.export-dialog {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      max-width: 600px;
      width: 90%;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-lg);
      margin: auto;
    }
    dialog.export-dialog::backdrop {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
    }
    .export-modal-inner h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .export-modal-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .export-textarea {
      width: 100%;
      height: 220px;
      font-family: var(--mono);
      font-size: 0.78rem;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      resize: none;
      margin-bottom: 14px;
    }
    .export-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Concept & Matrices Views */
    .concept-list { display: flex; flex-direction: column; gap: 12px; }
    .concept-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
    }
    .concept-card h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
    .concept-card .concept-tag { display: inline-block; font-size: 0.66rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; margin-bottom: 8px; }
    .concept-card p { margin: 0 0 8px; font-size: 0.88rem; color: var(--muted); }
    .field-list { display: grid; grid-template-columns: 170px 1fr; gap: 3px 14px; margin: 10px 0 0; font-size: 0.8rem; }
    .field-list dt { color: var(--muted); font-weight: 600; }
    .field-list dd { margin: 0; }

    .matrix-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .matrix-block h3 { font-size: 0.9rem; font-weight: 700; margin: 0 0 12px; color: var(--text); }
    .matrix-scroll { overflow-x: auto; }
    table.matrix { border-collapse: collapse; font-size: 0.76rem; width: 100%; }
    table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; white-space: nowrap; }
    table.matrix thead th { background: var(--surface-2); font-weight: 600; color: var(--text); }
    table.matrix tbody th { background: var(--surface-2); text-align: left; font-weight: 600; color: var(--text); }
    table.matrix td:empty::after { content: "·"; color: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 40px 0; }

    /* Reference Dialog */
    #innfo-ref-dialog {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 0;
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-lg);
    }
    #innfo-ref-dialog::backdrop { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); }
    #innfo-ref-dialog .innfo-ref-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #innfo-ref-dialog .innfo-ref-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    #innfo-ref-dialog .innfo-ref-close {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: var(--radius-sm);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
    }
    #innfo-ref-dialog .innfo-ref-body { padding: 16px 20px 20px; }
    #innfo-ref-dialog .innfo-ref-tag { display: inline-block; font-size: 0.64rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; margin-bottom: 10px; }
    #innfo-ref-dialog .innfo-ref-desc { margin: 0 0 12px; font-size: 0.88rem; }
    #innfo-ref-dialog .innfo-ref-fields { display: grid; grid-template-columns: 170px 1fr; gap: 3px 14px; margin: 0; font-size: 0.8rem; }
    #innfo-ref-dialog .innfo-ref-fields dt { color: var(--muted); font-weight: 600; }
    #innfo-ref-dialog .innfo-ref-fields dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="badge">NN Procedures Console</span>
      <h1 id="doc-title">Procedures Console</h1>
      <div class="meta-line" id="doc-meta"></div>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Concept rail">
      <div class="rail-label">Concepts</div>
    </nav>

    <main>
      <nav class="tabs" aria-label="Console views">
        <button class="tab active" data-view="procedures" type="button">Procedures</button>
      </nav>

      <section data-view="procedures" class="active" id="view-procedures">
        <div id="proc-tabs"></div>
        <nav class="subtabs" aria-label="Procedure view mode">
          <button class="subtab active" data-mode="wizard" type="button">Interactive Runner & DAG</button>
          <button class="subtab" data-mode="document" type="button">Document</button>
        </nav>
        <div id="doc-body" class="hidden"></div>
        <div id="wizard-body">
          <div id="progress"></div>
          <div id="step-body"></div>
        </div>
      </section>

      <section data-view="matrices" id="view-matrices">
        <div id="matrix-port"></div>
      </section>

      <section data-view="concept" id="view-concept">
        <div id="content"></div>
      </section>
    </main>
  </div>

  <dialog id="innfo-ref-dialog" aria-label="Referenced element details"></dialog>

  <!-- innfo-console seam: capability gate (pins in console/needs-registry.json). Slots below stay the only per-model payload. -->
  <script type="application/json" id="innfo-config">
    {
      "needs": [
        "guided-procedure",
        "reference-popup",
        "concept-rail",
        "matrix-grids"
      ]
    }
  </script>
  <script type="application/json" id="innfo-schema">
{}
  </script>
  <script type="application/json" id="innfo-model">
{}
  </script>
  <!-- Single-file console bundle (runtime + visuals + renderers). Static tags: CDN primary, mirror fallback, vendored — no fetch, no modules. -->
  <script src="https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.7.2/iNNfo/specs/templates/console/innfo-console.bundle.js"></script>
  <script src="https://raw.githubusercontent.com/cogNNitive/cogNNitive-web/main/iNNfo/specs/templates/console/innfo-console.bundle.js"></script>
  <script src="./innfo-console.bundle.js"></script>
</body>
</html>
