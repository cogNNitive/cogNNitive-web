<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NN Procedures Console</title>
  <!--
    Reference shell for the "Compile Procedures Console" procedure.

    The generating agent replaces ONLY the contents of the two JSON blocks below:
      #innfo-schema  -> Schema JSON Contract  (concepts, fields, markers, matrices)
      #innfo-model   -> Model JSON Contract   (meta, elements, matrices)
    Nothing else in this file is edited. The renderer is template-agnostic
    and lives in console/render-procedure-stepper.js (UMD window.InnfoProcedureStepper).
  -->
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f4f4f5;
      --text: #0a0a0a;
      --muted: #737373;
      --faint: #a1a1a1;
      --border: #e5e5e5;
      --primary: #171717;
      --primary-hover: #0a0a0a;
      --success: #16a34a;
      --danger: #e7000b;
      --warning: #d97706;
      --info: #2563eb;
      --radius-sm: 6px;
      --radius: 8px;
      --radius-lg: 10px;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'SF Mono', ui-monospace, 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --surface: #0a0a0a;
        --surface-2: #27272a;
        --text: #fafafa;
        --muted: #a1a1a1;
        --faint: #737373;
        --border: #27272a;
        --primary: #e5e5e5;
        --primary-hover: #fafafa;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    code { font-family: var(--mono); font-size: 0.85em; }

    header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.4px; }
    header .meta-line { font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
    header .meta-line span strong { color: var(--text); font-weight: 600; }

    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    nav.rail {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 20px 10px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    @media (max-width: 820px) { nav.rail { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
    nav.rail .rail-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 0 10px 8px;
    }
    nav.rail button.rail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav.rail button.rail-item:hover { background: var(--surface-2); }
    nav.rail button.rail-item.active { background: var(--surface-2); border-left-color: var(--primary); font-weight: 700; }
    nav.rail button.rail-item .count { color: var(--muted); font-size: 0.74rem; font-weight: 600; }
    nav.rail button.rail-item .rail-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
      margin-right: 6px;
    }
    nav.rail button.rail-item .rail-label-text { flex: 1 1 auto; min-width: 0; }
    nav.rail button.rail-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    main { max-width: 1080px; padding: 24px 28px 96px; min-width: 0; }

    /* Primary tabs: Procedures | Matrices */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    button.tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.12s ease, border-color 0.12s ease;
    }
    button.tab:hover { color: var(--text); }
    button.tab.active { color: var(--text); border-bottom-color: var(--primary); }
    button.tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); border-radius: 4px; }

    section[data-view] { display: none; }
    section[data-view].active { display: block; }

    /* Sub-tabs inside Procedures: Document | Wizard */
    .subtabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }
    button.subtab {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button.subtab:hover { border-color: var(--muted); color: var(--text); }
    button.subtab.active { background: var(--primary); border-color: var(--primary); color: var(--bg); }
    button.subtab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }
    #wizard-body.hidden { display: none; }
    #doc-body.hidden { display: none; }

    /* Document view */
    .doc-root {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }
    .doc-root h2 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .doc-root p.desc { margin: 0; font-size: 0.9rem; }
    .doc-step {
      border-left: 3px solid var(--border);
      padding: 12px 16px;
      margin: 0 0 10px 8px;
      background: var(--surface);
    }
    .doc-step h3 { margin: 0 0 6px; font-size: 0.98rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .doc-step .step-type-icon { color: var(--muted); }
    .doc-step p.desc { margin: 0 0 10px; font-size: 0.88rem; }

    /* Procedure selector */
    #proc-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    button.proc-tab {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button.proc-tab:hover { border-color: var(--muted); color: var(--text); }
    button.proc-tab.active { background: var(--primary); border-color: var(--primary); color: var(--bg); }
    button.proc-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    /* Stepper progress rail */
    .proc-progress {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 2px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .step-node { display: flex; align-items: center; gap: 0; }
    .step-node .step-node-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 104px;
      text-align: center;
      flex: none;
    }
    .step-node .step-link { width: 28px; height: 2px; background: var(--border); flex: none; }
    .step-node.done .step-link { background: var(--success); }
    .step-node.pending .step-link { background: var(--border); }

    button.step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.12s ease;
    }
    button.step-dot:hover { border-color: var(--muted); color: var(--text); }
    .step-node.pending button.step-dot { opacity: 0.35; }
    .step-node.active button.step-dot {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.12);
    }
    .step-node.done button.step-dot { background: var(--success); border-color: var(--success); color: #fff; }
    button.step-dot:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    .step-dot-label {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.25;
      overflow-wrap: anywhere;
      max-width: 104px;
    }
    .step-node.active .step-dot-label { color: var(--text); }

    /* Step detail card */
    .step-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 20px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }
    .step-card h3 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .step-type-icon { color: var(--muted); }
    .step-card p.desc { margin: 0 0 14px; font-size: 0.9rem; color: var(--text); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
    button.chip-ref {
      appearance: none;
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--info);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    button.chip-ref:hover { border-color: var(--info); background: rgba(37, 99, 235, 0.06); }
    button.chip-ref:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    .io { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .io-pill {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      background: var(--surface);
    }
    .io-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .io-val {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--info);
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    .io-val:hover { text-decoration: underline; }
    .io-val:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); border-radius: 3px; }
    .io-in .io-val { color: var(--info); }
    .io-out .io-val { color: var(--success); }

    .raci { margin-top: 4px; }
    .raci h4 { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 0 0 8px; }
    button.raci-pill {
      appearance: none;
      font: inherit;
      cursor: pointer;
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: rgba(37, 99, 235, 0.08);
      color: var(--info);
      border: 1px solid rgba(37, 99, 235, 0.25);
      margin: 0 6px 6px 0;
    }
    button.raci-pill:hover { background: rgba(37, 99, 235, 0.14); }
    button.raci-pill:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button.btn {
      appearance: none;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.btn:hover:not(:disabled) { background: var(--surface-2); }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
    button.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--bg); }
    button.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    button.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--text); }

    /* Concept content view */
    .concept-list { display: flex; flex-direction: column; gap: 12px; }
    .concept-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
    }
    .concept-card h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
    .concept-card .concept-tag { display: inline-block; font-size: 0.66rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; margin-bottom: 8px; }
    .concept-card p { margin: 0 0 8px; font-size: 0.88rem; color: var(--muted); }
    .field-list { display: grid; grid-template-columns: 170px 1fr; gap: 3px 14px; margin: 10px 0 0; font-size: 0.8rem; }
    .field-list dt { color: var(--muted); font-weight: 600; }
    .field-list dd { margin: 0; }

    /* Matrices tab */
    .matrix-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
    .matrix-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .matrix-block h3 { font-size: 0.9rem; font-weight: 700; margin: 0 0 12px; color: var(--text); }
    .matrix-scroll { overflow-x: auto; }
    table.matrix { border-collapse: collapse; font-size: 0.76rem; width: 100%; }
    table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; white-space: nowrap; }
    table.matrix thead th { background: var(--surface-2); font-weight: 600; color: var(--text); }
    table.matrix tbody th { background: var(--surface-2); text-align: left; font-weight: 600; color: var(--text); }
    table.matrix td:empty::after { content: "·"; color: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 40px 0; }

    /* Reference dialog */
    #innfo-ref-dialog {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0;
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
    }
    #innfo-ref-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
    #innfo-ref-dialog .innfo-ref-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #innfo-ref-dialog .innfo-ref-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    #innfo-ref-dialog .innfo-ref-close {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: var(--radius-sm);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
    }
    #innfo-ref-dialog .innfo-ref-close:hover { color: var(--text); background: var(--surface-2); }
    #innfo-ref-dialog .innfo-ref-body { padding: 16px 20px 20px; }
    #innfo-ref-dialog .innfo-ref-tag { display: inline-block; font-size: 0.64rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; margin-bottom: 10px; }
    #innfo-ref-dialog .innfo-ref-desc { margin: 0 0 12px; font-size: 0.88rem; }
    #innfo-ref-dialog .innfo-ref-fields { display: grid; grid-template-columns: 170px 1fr; gap: 3px 14px; margin: 0; font-size: 0.8rem; }
    #innfo-ref-dialog .innfo-ref-fields dt { color: var(--muted); font-weight: 600; }
    #innfo-ref-dialog .innfo-ref-fields dd { margin: 0; }
    .innfo-ref-pill {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--info);
      border-radius: 999px;
      padding: 1px 8px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .innfo-ref-pill:hover { border-color: var(--info); background: rgba(37, 99, 235, 0.06); }
  </style>
</head>
<body>
  <header>
    <span class="badge">NN Procedures Console</span>
    <h1 id="doc-title">Procedures Console</h1>
    <div class="meta-line" id="doc-meta"></div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Concept rail">
      <div class="rail-label">Concepts</div>
    </nav>

    <main>
      <nav class="tabs" aria-label="Console views">
        <button class="tab active" data-view="procedures" type="button">Procedures</button>
      </nav>

      <section data-view="procedures" class="active" id="view-procedures">
        <div id="proc-tabs"></div>
        <nav class="subtabs" aria-label="Procedure view mode">
          <button class="subtab active" data-mode="document" type="button">Document</button>
          <button class="subtab" data-mode="wizard" type="button">Wizard</button>
        </nav>
        <div id="doc-body"></div>
        <div id="wizard-body">
          <div id="progress"></div>
          <div id="step-body"></div>
        </div>
      </section>

      <section data-view="matrices" id="view-matrices">
        <div id="matrix-port"></div>
      </section>

      <section data-view="concept" id="view-concept">
        <div id="content"></div>
      </section>
    </main>
  </div>

  <dialog id="innfo-ref-dialog" aria-label="Referenced element details"></dialog>

  <!-- innfo-console seam: capability gate (pins in console/needs-registry.json). Slots below stay the only per-model payload. -->
  <script type="application/json" id="innfo-config">
    {
      "needs": [
        "guided-procedure",
        "reference-popup",
        "concept-rail",
        "matrix-grids",
        "feedback-export"
      ],
      "runtime": {
        "cdn": "https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.1.0/iNNfo/specs/templates/console/innfo-console.bundle.js",
        "fallback": "https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-console.bundle.js"
      }
    }
  </script>
  <script type="application/json" id="innfo-schema">
{}
  </script>
  <script type="application/json" id="innfo-model">
{}
  </script>
  <!-- Single-file console bundle (runtime + visuals + renderers). Static tags: CDN primary, mirror fallback, vendored — no fetch, no modules. -->
  <script src="https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-v0.1.0/iNNfo/specs/templates/console/innfo-console.bundle.js"></script>
  <script src="https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-console.bundle.js"></script>
  <script src="./innfo-console.bundle.js"></script>
</body>
</html>
