<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iNNfo DomaiNN Console</title>
  <!--
    domaiNN_console.html — Canonical Level-2 Domain Console Shell.
    Provides faceted navigation (Tags & Changes) over domain blueprints and embedded console slots.
    Generated and hydrated via domaiNN models and compiled blueprints.
  -->
  <link rel="stylesheet" href="../../console/innfo-ui.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;

      /* Subtle control area tokens (Slate tinted, not pitch black) */
      --filter-zone-bg: #f1f5f9;
      --filter-box-bg: #ffffff;
      --filter-box-border: #cbd5e1;

      --radius-sm: 6px;
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar */
    header.innfo-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .badge-domain {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.2);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }
    .domain-title { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--text); }

    /* Layout 2 Panels */
    .innfo-split-layout { display: flex; flex: 1; overflow: hidden; }

    /* Left Blueprint Navigation Rail */
    aside.blueprint-rail {
      width: 370px;
      min-width: 370px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* SUBTLE FILTER SECTION (Refined slate-200 tint, clear but quiet) */
    .filter-zone {
      background: var(--filter-zone-bg);
      border-bottom: 1px solid var(--filter-box-border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Search input inside filter zone */
    .search-input-wrap { position: relative; }
    .search-input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 7px 12px 7px 34px;
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--filter-box-bg);
      border: 1px solid var(--filter-box-border);
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }
    .search-input::placeholder { color: var(--faint); }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Compact Accordion in Filter Zone */
    .accordion-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .accordion-card {
      background: var(--filter-box-bg);
      border: 1px solid var(--filter-box-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .accordion-head {
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: #fafcff;
      border-bottom: 1px solid transparent;
      transition: background 0.1s;
    }
    .accordion-head:hover { background: #f1f5f9; color: var(--text); }
    .accordion-card.open .accordion-head {
      border-bottom-color: var(--border);
    }
    .accordion-body {
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .accordion-body.collapsed { display: none; }

    .facet-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: #334155;
      cursor: pointer;
      transition: all 0.1s;
    }
    .facet-item-row:hover { background: #f1f5f9; color: var(--text); }
    .facet-item-row.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 700;
    }
    .facet-item-row .count-badge {
      font-size: 0.7rem;
      color: var(--muted);
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 8px;
    }
    .facet-item-row.active .count-badge {
      background: rgba(37, 99, 235, 0.1);
      border-color: rgba(37, 99, 235, 0.2);
      color: var(--primary);
    }

    /* Blueprint Cards List (Light background) */
    .blueprint-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
    }
    .blueprint-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .blueprint-card:hover {
      border-color: #cbd5e1;
      background: #ffffff;
      transform: translateY(-1px);
    }
    .blueprint-card.active {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 0 0 1.5px var(--primary);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .card-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
    }
    .card-icon-badge svg {
      width: 13px;
      height: 13px;
    }
    .card-tag-name {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-changes-pill {
      font-size: 0.65rem;
      font-weight: 700;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fde68a;
      padding: 1px 5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .card-version {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: monospace;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin: 0 0 3px;
      color: var(--text);
      line-height: 1.3;
    }
    .blueprint-card.active .card-title { color: var(--primary); }
    .card-meta {
      display: flex;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(0, 0, 0, 0.06);
    }

    /* Main Console Viewer Container */
    main.slot-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      min-width: 0;
    }

    /* MINIMALIST DISCREET ACTION BAR (No redundant duplicate title) */
    .slot-action-bar {
      padding: 6px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 38px;
    }
    .slot-context-crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .slot-context-crumb strong { color: var(--text); font-weight: 600; }
    .btn-standalone {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--primary);
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-standalone:hover {
      background: var(--surface-3);
      border-color: #cbd5e1;
    }
    .iframe-slot { flex: 1; width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>
  <header class="innfo-navbar">
    <div class="brand-group">
      <span class="badge-domain">DomaiNN</span>
      <h1 class="domain-title" id="navbarDomainTitle">Domain Operations</h1>
      <span style="font-size:0.8rem; color:var(--muted);" id="navbarConsoleCount">• Consoles</span>
    </div>
    <div style="font-size:0.76rem; color:var(--muted); font-weight:500;">
      Active Mode: <strong>DomaiNN Console</strong>
    </div>
  </header>

  <div class="innfo-split-layout">
    <aside class="blueprint-rail">
      <!-- SUBTLE FILTER CONTROL ZONE -->
      <div class="filter-zone">
        <!-- Search Input -->
        <div class="search-input-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search blueprints by name or concept..." autocomplete="off" />
        </div>

        <!-- Compact Accordion for Tags and Changes -->
        <div class="accordion-group">
          <!-- Tags card -->
          <div class="accordion-card open" id="card-tags">
            <div class="accordion-head" onclick="toggleAccordion('tags')">
              <span>Tags</span>
              <span id="arrow-tags" style="font-size:0.65rem;">▲</span>
            </div>
            <div class="accordion-body" id="body-tags"></div>
          </div>

          <!-- Changes card -->
          <div class="accordion-card open" id="card-changes">
            <div class="accordion-head" onclick="toggleAccordion('changes')">
              <span>Changes</span>
              <span id="arrow-changes" style="font-size:0.65rem;">▲</span>
            </div>
            <div class="accordion-body" id="body-changes"></div>
          </div>
        </div>
      </div>

      <!-- BLUEPRINT CARDS LIST -->
      <div class="blueprint-list" id="blueprintList"></div>
    </aside>

    <!-- MAIN CONSOLE VIEWER -->
    <main class="slot-container">
      <div class="slot-action-bar">
        <div class="slot-context-crumb" id="slotCrumb"></div>
        <div>
          <a id="btnStandalone" href="#" target="_blank" class="btn-standalone">
            <span>Open in standalone tab</span>
            <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
        </div>
      </div>
      <iframe id="consoleFrame" class="iframe-slot" src="about:blank"></iframe>
    </main>
  </div>

  <!-- JSON Payload Injections for Domain Schema & Model -->
  <script type="application/json" id="innfo-domain">
{}
  </script>

  <script>
    const SVG_ICONS = {
      "target": '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      "activity": '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
      "cpu": '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
      "shield-check": '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>'
    };

    function parseJSON(id) {
      const node = document.getElementById(id);
      if (!node) return null;
      try {
        return JSON.parse(node.textContent.trim() || '{}');
      } catch (e) {
        console.error('Bad JSON in #' + id, e);
        return null;
      }
    }

    let catalog = [];
    let selectedTag = 'ALL';
    let selectedChanges = 'ALL';
    let searchQuery = '';
    let activeId = null;

    const accordionState = { tags: true, changes: true };

    function init() {
      const domainData = parseJSON('innfo-domain') || {};
      if (domainData.title) {
        document.getElementById('navbarDomainTitle').textContent = domainData.title;
      }
      catalog = Array.isArray(domainData.blueprints) ? domainData.blueprints : [];
      document.getElementById('navbarConsoleCount').textContent = `• ${catalog.length} Consoles`;

      renderFacets();
      renderList();
      if (catalog.length > 0) selectBlueprint(catalog[0].id);
    }

    function toggleAccordion(key) {
      accordionState[key] = !accordionState[key];
      const card = document.getElementById('card-' + key);
      const body = document.getElementById('body-' + key);
      const arrow = document.getElementById('arrow-' + key);

      card.classList.toggle('open', accordionState[key]);
      body.classList.toggle('collapsed', !accordionState[key]);
      arrow.textContent = accordionState[key] ? '▲' : '▼';
    }

    function renderFacets() {
      const tagCounts = { ALL: catalog.length };
      catalog.forEach(item => {
        const t = item.tag || 'General';
        tagCounts[t] = (tagCounts[t] || 0) + 1;
      });

      const tags = ['ALL', ...Object.keys(tagCounts).filter(k => k !== 'ALL')];
      document.getElementById('body-tags').innerHTML = tags.map(tag => `
        <div class="facet-item-row ${selectedTag === tag ? 'active' : ''}" onclick="selectTagFacet('${tag}')">
          <span>${tag === 'ALL' ? 'All tags' : tag}</span>
          <span class="count-badge">${tagCounts[tag] || 0}</span>
        </div>
      `).join('');

      const countChanged = catalog.filter(c => c.hasChanges).length;
      const countClean = catalog.length - countChanged;

      document.getElementById('body-changes').innerHTML = `
        <div class="facet-item-row ${selectedChanges === 'ALL' ? 'active' : ''}" onclick="selectChangesFacet('ALL')">
          <span>All blueprints</span>
          <span class="count-badge">${catalog.length}</span>
        </div>
        <div class="facet-item-row ${selectedChanges === 'CHANGED' ? 'active' : ''}" onclick="selectChangesFacet('CHANGED')">
          <span style="color:#b45309; font-weight:${selectedChanges === 'CHANGED' ? '700' : '500'};">● With changes</span>
          <span class="count-badge">${countChanged}</span>
        </div>
        <div class="facet-item-row ${selectedChanges === 'CLEAN' ? 'active' : ''}" onclick="selectChangesFacet('CLEAN')">
          <span>No changes</span>
          <span class="count-badge">${countClean}</span>
        </div>
      `;
    }

    function selectTagFacet(tag) {
      selectedTag = tag;
      renderFacets();
      renderList();
    }

    function selectChangesFacet(c) {
      selectedChanges = c;
      renderFacets();
      renderList();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderList();
    });

    function renderList() {
      const list = document.getElementById('blueprintList');
      const filtered = catalog.filter(item => {
        const itemTag = item.tag || 'General';
        if (selectedTag !== 'ALL' && itemTag !== selectedTag) return false;
        if (selectedChanges === 'CHANGED' && !item.hasChanges) return false;
        if (selectedChanges === 'CLEAN' && item.hasChanges) return false;
        if (searchQuery) {
          const matchTitle = (item.title || '').toLowerCase().includes(searchQuery);
          const matchBp = (item.blueprint || '').toLowerCase().includes(searchQuery);
          const matchConcepts = Array.isArray(item.concepts) && item.concepts.some(c => c.toLowerCase().includes(searchQuery));
          if (!matchTitle && !matchBp && !matchConcepts) return false;
        }
        return true;
      });

      if (!filtered.length) {
        list.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:32px 10px;">No blueprints match the selected filters.</div>';
        return;
      }

      list.innerHTML = filtered.map(item => {
        const svgContent = SVG_ICONS[item.icon] || SVG_ICONS['target'];
        const tagColor = item.tagColor || '#2563eb';
        return `
          <div class="blueprint-card ${activeId === item.id ? 'active' : ''}" onclick="selectBlueprint('${item.id}')">
            <div class="card-top">
              <div class="card-badge-group">
                <div class="card-icon-badge" style="background:${tagColor}15; color:${tagColor};">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${svgContent}</svg>
                </div>
                <span class="card-tag-name" style="color:${tagColor};">${item.tag || 'General'}</span>
                ${item.hasChanges ? `<span class="card-changes-pill">● ${item.draftCount || 1}</span>` : ''}
              </div>
              <span class="card-version">${item.version || ''}</span>
            </div>
            <div class="card-title">${item.title || item.blueprint}</div>
            <div class="card-meta">
              <span><strong>${item.elementCount || 0}</strong> elements</span>
              <span><strong>${item.conceptCount || 0}</strong> concepts</span>
              <span><strong>${item.matrixCount || 0}</strong> matrices</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectBlueprint(id) {
      activeId = id;
      const item = catalog.find(c => c.id === id);
      if (!item) return;

      const tagColor = item.tagColor || '#2563eb';
      const crumb = document.getElementById('slotCrumb');
      crumb.innerHTML = `
        <span style="color:${tagColor}; font-weight:700;">● ${item.tag || 'General'}</span>
        <span style="color:var(--border);">/</span>
        <strong>${item.blueprint}</strong>
        <span style="font-family:monospace; font-size:0.72rem; color:var(--muted);">(${item.version || ''})</span>
        ${item.hasChanges ? `<span class="card-changes-pill" style="margin-left:4px;">● ${item.draftCount || 1} pending change${(item.draftCount || 1) > 1 ? 's' : ''}</span>` : ''}
      `;

      document.getElementById('btnStandalone').href = item.relPath || '#';
      document.getElementById('consoleFrame').src = item.relPath || 'about:blank';

      renderList();
    }

    // Auto-init on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
